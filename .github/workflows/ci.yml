name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Confirm toolchain versions
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: apps/frontend
        run: npm run test

      - name: Lint frontend
        working-directory: apps/frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: apps/frontend
        run: npm run typecheck

      - name: Check changed frontend formatting
        working-directory: apps/frontend
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$FORMAT_BASE_SHA" || "$FORMAT_BASE_SHA" =~ ^0+$ ]]; then
            FORMAT_BASE_SHA="$(git merge-base "$GITHUB_SHA" origin/main)"
          fi

          mapfile -t changed_files < <(
            git diff --name-only --diff-filter=ACMR "$FORMAT_BASE_SHA" "$GITHUB_SHA" -- \
              'apps/frontend/**/*.ts' 'apps/frontend/**/*.tsx'
          )

          if (( ${#changed_files[@]} == 0 )); then
            echo "No changed frontend TypeScript files to check."
            exit 0
          fi

          frontend_files=()
          for file in "${changed_files[@]}"; do
            frontend_files+=("${file#apps/frontend/}")
          done

          npx prettier --check "${frontend_files[@]}"

      - name: Build frontend
        working-directory: apps/frontend
        env:
          API_AUDIENCE: whiteplate-api
          API_BASE_URL: https://api.invalid
          BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-builds
          BETTER_AUTH_URL: https://auth.invalid
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/whiteplate_ci
          GOOGLE_CLIENT_ID: ci-client.invalid
          GOOGLE_CLIENT_SECRET: ci-only-google-secret
          MICROSOFT_CLIENT_ID: ci-client.invalid
          MICROSOFT_CLIENT_SECRET: ci-only-microsoft-secret
          RESEND_API_KEY: re_ci_only
          RESEND_FROM_EMAIL: ci@whiteplate.invalid
        run: npm run build

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Confirm SDK version
        run: dotnet --version

      - name: Test API solution
        run: dotnet test apps/api/WhitePlate.slnx --configuration Release
